<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Fill missing summaries in Zotero</title>
  <style>
    :root { --navy: #0f2a44; --green: #2f7d5b; --line: #e3ddd2; --muted: #5b6673; --red: #b3261e; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: #fbf9f5; color: #1d2733; line-height: 1.5; }
    header { background: var(--navy); color: #fff; padding: 1.4rem 1.2rem; }
    header h1 { margin: 0; font-family: Georgia, serif; font-size: 1.5rem; }
    header p { margin: .4rem 0 0; color: #cfdbe6; }
    main { max-width: 640px; margin: 0 auto; padding: 1.2rem; }
    .card { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 1.1rem; margin-bottom: 1rem; }
    label { display: block; font-weight: 600; margin-bottom: .8rem; }
    input[type=password] { display: block; width: 100%; margin-top: .3rem; padding: .7rem; font: inherit; border: 1px solid #cfc8bb; border-radius: 8px; }
    .check { display: flex; gap: .6rem; align-items: flex-start; font-weight: 500; }
    .check input { margin-top: .3rem; width: 1.1rem; height: 1.1rem; }
    .hint { font-weight: 400; color: var(--muted); font-size: .9rem; }
    button { width: 100%; padding: .9rem; font: inherit; font-weight: 600; color: #fff; background: var(--green); border: 0; border-radius: 999px; cursor: pointer; }
    button.stop { background: #fff; color: var(--red); border: 1px solid var(--red); margin-top: .6rem; }
    button:disabled { background: #9bb5a8; }
    progress { width: 100%; height: 14px; }
    #summary { font-weight: 600; margin: .5rem 0; }
    #log { font-size: .88rem; margin: .4rem 0 0; max-height: 22rem; overflow: auto; }
    #log div { padding: .15rem 0; border-bottom: 1px solid #f1ece3; }
    .ok { color: var(--green); } .err { color: var(--red); } .dim { color: var(--muted); }
    #log img { height: 44px; vertical-align: middle; margin-right: .4rem; border-radius: 2px; }
  </style>
  <style>
    textarea { width: 100%; min-height: 12rem; font: .85rem/1.4 ui-monospace, monospace; padding: .6rem; border: 1px solid #cfc8bb; border-radius: 8px; }
    button.alt { background: var(--navy); margin-top: .6rem; }
  </style>
</head>
<body>
  <header>
    <h1>Fill missing summaries</h1>
    <p>Lists the readings that still have no summary, and saves the summaries written for them.</p>
  </header>
  <main>
    <form id="form" class="card">
      <label>Zotero API key (with write access)
        <input id="key" type="password" autocomplete="off" required placeholder="Paste your key">
      </label>
      <button id="list" type="submit">1. List readings without a summary</button>
      <button id="save" type="button" class="alt">2. Save the written summaries</button>
      <p class="hint" id="ready" style="margin:.6rem 0 0"></p>
    </form>
    <div class="card" id="out-card" hidden>
      <div id="summary"></div>
      <textarea id="out" readonly></textarea>
      <button id="copy" type="button" class="alt">Copy the list</button>
      <p class="hint">Paste the list into the chat with Claude. Once the summaries are written, come back and press button 2.</p>
    </div>
    <div class="card" id="progress-card" hidden>
      <progress id="bar" value="0" max="1"></progress>
      <div id="psummary"></div>
      <div id="log"></div>
    </div>
  </main>
<script>
const ZOT = 'https://api.zotero.org';
const LISTS = ['PhD coursework reading lists', 'Bi-vocational ministry reading list'];
const $ = id => document.getElementById(id);
let stopping = false;

const sleep = ms => new Promise(r => setTimeout(r, ms));
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')
  .replace(/^(the|a|an)\s+/, '').split(/[:.(?]/)[0].replace(/[^a-z0-9]+/g, ' ').trim();
const strip = s => String(s || '').replace(/<br\s*\/?>/gi, '\n').replace(/<\/p>/gi, '\n\n').replace(/<[^>]+>/g, '')
  .replace(/&quot;/g, '"').replace(/&#39;|&apos;/g, "'").replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>')
  .replace(/\n{3,}/g, '\n\n').trim();
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

function log(html, cls = '') {
  const d = document.createElement('div');
  d.innerHTML = html;
  if (cls) d.className = cls;
  $('log').prepend(d);
}

// ---------- Zotero ----------
async function zot(path, key, opts = {}) {
  for (let attempt = 0; attempt < 5; attempt++) {
    const res = await fetch(ZOT + path, {
      ...opts,
      headers: { 'Zotero-API-Key': key, 'Zotero-API-Version': '3', ...(opts.body ? { 'Content-Type': 'application/json' } : {}), ...(opts.headers || {}) },
    });
    const wait = Number(res.headers.get('Backoff') || res.headers.get('Retry-After') || 0);
    if (res.status === 429 || res.status === 503) { await sleep((wait || 5) * 1000); continue; }
    if (wait) await sleep(wait * 1000);
    if (!res.ok && res.status !== 412) throw new Error(`Zotero ${res.status}: ${await res.text()}`);
    return res.status === 204 || res.status === 412 ? { status: res.status } : { status: res.status, json: await res.json() };
  }
  throw new Error('Zotero is busy. Try again in a few minutes.');
}

async function zotAll(path, key) {
  const out = [];
  for (let start = 0; ; start += 100) {
    const { json } = await zot(`${path}${path.includes('?') ? '&' : '?'}limit=100&start=${start}`, key);
    out.push(...json);
    if (json.length < 100) return out;
  }
}


let SUMMARIES = {};
fetch('zotero-summaries.json?v=' + Date.now()).then(r => r.ok ? r.json() : {}).then(j => {
  SUMMARIES = j || {};
  const n = Object.keys(SUMMARIES).length;
  $('ready').textContent = n ? `${n} written summaries are ready to save.` : 'No written summaries yet. Start with button 1.';
  $('save').disabled = !n;
}).catch(() => { $('save').disabled = true; });

async function gather(key) {
  const { json: k } = await zot('/keys/current', key);
  if (!k.access?.user?.write) throw new Error('This key cannot write to your library. Make a key with "Allow write access" ticked.');
  const user = k.userID;
  const cols = await zotAll(`/users/${user}/collections?format=json`, key);
  const parents = cols.filter(c => LISTS.includes(c.data.name)).map(c => c.key);
  const subs = cols.filter(c => parents.includes(c.data.parentCollection) || parents.includes(c.key)).map(c => c.key);
  const byKey = new Map();
  for (const ck of subs) for (const it of await zotAll(`/users/${user}/collections/${ck}/items/top?format=json`, key)) byKey.set(it.key, it);
  return { user, items: [...byKey.values()] };
}
const who = d => (d.creators || []).slice(0, 2).map(c => c.lastName || c.name || '').filter(Boolean).join(' & ');
const year = d => (String(d.date || '').match(/\d{4}/) || [''])[0];

$('form').addEventListener('submit', async e => {
  e.preventDefault();
  const key = $('key').value.trim();
  $('list').disabled = true;
  $('out-card').hidden = false;
  $('summary').textContent = 'Reading your library…';
  try {
    const { items } = await gather(key);
    const missing = items.filter(it => !String(it.data.abstractNote || '').trim())
      .sort((a, b) => who(a.data).localeCompare(who(b.data)));
    $('summary').textContent = `${missing.length} of ${items.length} readings have no summary.`;
    $('out').value = missing.map(it => [it.key, who(it.data), it.data.title, year(it.data), it.data.itemType].join(' | ')).join('\n');
  } catch (err) {
    $('summary').textContent = 'Stopped: ' + err.message;
  } finally {
    $('list').disabled = false;
  }
});

$('copy').addEventListener('click', async () => {
  try { await navigator.clipboard.writeText($('out').value); $('copy').textContent = 'Copied'; }
  catch { $('out').select(); document.execCommand('copy'); $('copy').textContent = 'Copied'; }
  setTimeout(() => $('copy').textContent = 'Copy the list', 2000);
});

$('save').addEventListener('click', async () => {
  const key = $('key').value.trim();
  if (!key) { $('key').focus(); return; }
  $('save').disabled = true;
  $('progress-card').hidden = false;
  $('log').textContent = '';
  let saved = 0, skipped = 0, failed = 0;
  try {
    const { user, items } = await gather(key);
    const todo = items.filter(it => SUMMARIES[it.key] && !String(it.data.abstractNote || '').trim());
    skipped = Object.keys(SUMMARIES).length - todo.length;
    $('bar').max = todo.length || 1;
    for (let i = 0; i < todo.length; i++) {
      const it = todo[i], d = it.data;
      try {
        const extra = (d.extra || '').split('\n').filter(l => l && !/^Summary source:/.test(l));
        extra.push('Summary source: written summary (Claude)');
        const res = await zot(`/users/${user}/items/${it.key}`, key, {
          method: 'PATCH',
          body: JSON.stringify({ abstractNote: SUMMARIES[it.key], extra: extra.join('\n') }),
          headers: { 'If-Unmodified-Since-Version': String(it.version) },
        });
        if (res.status === 412) throw new Error('changed in Zotero meanwhile; press the button again');
        saved++;
        log(`<b>${esc(d.title)}</b> — summary saved`, 'ok');
      } catch (err) {
        failed++;
        log(`<b>${esc(d.title)}</b> — ${esc(err.message)}`, 'err');
      }
      $('bar').value = i + 1;
      $('psummary').textContent = `${saved} saved${failed ? ` · ${failed} errors` : ''}${skipped ? ` · ${skipped} already had one` : ''}`;
    }
    if (!todo.length) $('psummary').textContent = 'Nothing to save: every listed reading already has a summary.';
    log('Done. In BookHub, press “Refresh from Zotero” to see them.', 'ok');
  } catch (err) {
    log('Stopped: ' + esc(err.message), 'err');
  } finally {
    $('save').disabled = false;
  }
});
</script>
</body>
</html>
